<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="icon" href="./images/logo.png">
  <title>老八云</title>

  <!-- 字体资源预加载 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- 样式合并与美化 -->
  <style>
    /* 全局基础重置 */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    #app {
      width: 100%;
      height: 100%;
    }

    html.preloader-active,
    body.preloader-active {
      overflow: hidden !important;
    }

    /* 隐藏滚动条 (桌面端) */
    @media (min-width: 769px) {
      *, html, body, div, main, section, article, aside, nav {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }

      ::-webkit-scrollbar,
      ::-webkit-scrollbar-button,
      ::-webkit-scrollbar-track,
      ::-webkit-scrollbar-track-piece,
      ::-webkit-scrollbar-thumb,
      ::-webkit-scrollbar-corner,
      ::-webkit-resizer {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
        background: transparent !important;
      }
    }

    /* 版本号样式 (若取消隐藏可使用) */
    .app-version {
      position: fixed;
      left: 6px;
      bottom: 4px;
      font-size: 9px;
      color: rgba(0, 0, 0, 0.35);
      user-select: none;
      pointer-events: none;
      z-index: 5;
    }
  </style>

  <!-- Crisp 客服脚本 -->
  <script type="text/javascript">
    window.$crisp = [];
    window.CRISP_WEBSITE_ID = "049b24fe-44a0-45ca-806c-b7bc37af56d1";
    (function () {
      var d = document;
      var s = d.createElement("script");
      s.src = "https://client.crisp.chat/l.js";
      s.async = 1;
      d.getElementsByTagName("head")[0].appendChild(s);
    })();
  </script>

  <!-- 业务逻辑打包 JS 文件 -->
  <script defer="defer" src="static/js/chunk-vendors.39a7dda0.js"></script>
  <script defer="defer" src="static/js/index.00647e26.js"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
